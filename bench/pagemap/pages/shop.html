<!doctype html><html><head><title>laptop - Search results</title>
<style>body{font-family:sans-serif;margin:0}.top{display:flex;gap:8px;padding:12px;background:#131921}.top input{flex:1;padding:8px}.top button{padding:8px 16px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:16px}.card{border:1px solid #ddd;padding:12px}.card img{width:100%;height:120px;background:#eee;display:block}
.price{font-weight:bold}.stars{color:#f90}.btn{background:#ffd814;border:0;padding:6px 12px;cursor:pointer;border-radius:12px}.tooltip{display:none}.filters{padding:16px}
.menu{position:absolute;left:-9999px}</style></head><body>
<div class="top"><a href="/"><img src="logo.png" alt="Shopmart"></a><input type="search" aria-label="Search Shopmart" value="laptop"><button type="submit">Search</button>
<a href="/cart" aria-label="Cart, 2 items"><img src="cart.png" alt=""></a></div>
<div class="filters"><h2>Filters</h2><label><input type="checkbox" name="prime"> Free shipping</label> <label><input type="checkbox" name="deal" checked> Today's deals</label>
<label for="sort">Sort by</label><select id="sort"><option>Featured</option><option selected>Price: Low to High</option><option>Avg. Customer Review</option></select></div>
<h1>Results for "laptop"</h1>
<div class="grid" id="grid"></div>
<nav aria-label="Pagination"><a href="?page=1" aria-current="page">1</a> <a href="?page=2">2</a> <a href="?page=3">3</a> <a href="?page=2">Next</a></nav>
<div class="menu"><a href="/hidden1">Offscreen menu link</a><button>Offscreen button</button></div>
<script>
const names=["Acer Aspire 5 15.6in Laptop","HP 14in Laptop Intel Celeron","Lenovo IdeaPad 3","ASUS Vivobook 16","Dell Inspiron 15","Apple MacBook Air 13in","Samsung Galaxy Book4","MSI Modern 14"];
let h='';for(let i=0;i<96;i++){const n=names[i%8]+' ('+(i+1)+')';const p=(199+i*7.5).toFixed(2);
h+=`<div class="card"><a href="/p/${i}"><img src="p${i}.jpg" alt="${n}"></a><a href="/p/${i}"><h3>${n}</h3></a><div class="stars" aria-label="4.3 out of 5 stars">★★★★☆ <span>(1,${i}23)</span></div><div class="price"><span aria-hidden="true">$${p}</span><span class="sr">$${p}</span></div><button class="btn">Add to cart</button><div class="tooltip">Ships free</div></div>`;}
document.getElementById('grid').innerHTML=h;</script></body></html>
