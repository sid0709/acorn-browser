[package]
name = "harness"
version = "0.1.0"
edition = "2024"
description = "A general-purpose agent harness: observe, plan, act, verify."
license = "MIT"

[dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ureq = "3.5.0"

[dev-dependencies]
serde_json = "1.0.154"
